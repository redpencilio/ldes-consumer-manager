steps:
  build-release:
    image: woodpeckerci/plugin-docker-buildx
    platforms: linux/amd64
    settings:
      repo: ${CI_REPO/redpencilio/redpencil}
      tags: "${CI_COMMIT_TAG##v}"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
when:
  - event: tag
    ref: refs/tags/v*
